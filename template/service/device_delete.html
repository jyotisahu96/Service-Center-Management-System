{% extends 'base.html' %}

{% block content %}

<h1>Delete Device</h1>

<p>
    Are you sure you want to delete
    <strong>{{ device.device_name }}</strong>?
</p>

<form method="POST">

    {% csrf_token %}

    <button type="submit">
        Yes, Delete
    </button>

</form>

<br>

<a href="{% url 'device_detail' device.id %}">
    Cancel
</a>

{% endblock %}
